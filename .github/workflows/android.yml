name: Build Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'server/**'
      - 'supabase/**'
      - '.vscode/**'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node Modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://kgjixulwpzurcedwwnor.supabase.co' }}" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnaml4dWx3cHp1cmNlZHc3d3JvciIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg1OTI0Nzc0LCJleHAiOjIxMDE1MDA3NzR9.AyR8ajQAmQ0BR8Qh7pEj57wli2AVk74Ll9JQoj1rW-o' }}" >> .env
          echo "EXPO_PUBLIC_BACKEND_URL=${{ secrets.EXPO_PUBLIC_BACKEND_URL || 'https://month-track.onrender.com/api' }}" >> .env

      - name: Expo Prebuild
        run: npx expo prebuild --platform android

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Fast Compile Release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            --build-cache --parallel \
            -x lint -x lintVitalAnalyzeRelease -x lintVitalRelease \
            -x test -x check \
            -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
