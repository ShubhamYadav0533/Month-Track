name: Build Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'server/**'
      - 'supabase/**'
      - '.vscode/**'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://kgjixulwpzurcedwwnor.supabase.co' }}" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnaml4dWx3cHp1cmNlZHw3d3JvciIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg1OTI0Nzc0LCJleHAiOjIxMDE1MDA3NzR9.AyR8ajQAmQ0BR8Qh7pEj57wli2AVk74Ll9JQoj1rW-o' }}" >> .env
          echo "EXPO_PUBLIC_BACKEND_URL=${{ secrets.EXPO_PUBLIC_BACKEND_URL || 'https://month-track.onrender.com/api' }}" >> .env

      - name: Expo Prebuild (if needed)
        run: npx expo prebuild --platform android --clean


      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Compile Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx4096m -XX:MaxMetaspaceSize=1024m\" -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
        run: |
          cd android
          ./gradlew assembleRelease -x lint -x lintVitalAnalyzeRelease -x lintVitalRelease --build-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
